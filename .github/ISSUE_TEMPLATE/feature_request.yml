name: Feature request
description: Suggest a new feature or improvement for EVA (eva_ai)
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please follow the issue format used in this repository (Triage / Summary / Proposed solution / Acceptance criteria).

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - high (important for many users)
        - medium (nice to have)
        - low (edge case / polish)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Chat / Frontend
        - Indexing / RAG
        - Search
        - Calendar tools
        - Files tools
        - Shares tools
        - Mail
        - Talk bot
        - TaskProcessing / Assistant
        - Settings
        - Security & Privacy
        - Background jobs
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should the feature do? Which problem does it solve?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: How could it be implemented? What should the user experience be?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know the feature is done?
      placeholder: |
        - [ ] ...
        - [ ] ...
