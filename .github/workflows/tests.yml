name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          # Retry because GitHub API zipball downloads can transiently fail
          # with "curl error 60: SSL certificate problem" on fresh runners.
          for i in 1 2 3; do
            composer install --no-interaction --prefer-dist && break
            echo "composer install attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Run tests
        run: composer test

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Files action behavior
        run: node --test tests/filesaction.test.cjs

      - name: Build production bundles
        run: npm run build

      - name: Verify expected bundles were emitted
        run: |
          for bundle in js/eva_ai-main.js js/eva_ai-main.js.map js/eva_ai_filesaction.js js/eva_ai_filesaction.js.map; do
            test -s "$bundle"
          done

  migration-regression:
    name: Migration and provider regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run migration/provider regression tests
        run: vendor/bin/phpunit --colors=always tests/MigrationRegressionTest.php tests/TaskProcessingContractTest.php tests/AppConfigUserSettingsTest.php

  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint all PHP files
        run: |
          find lib tests -name '*.php' -print0 | xargs -0 -n1 php -l
