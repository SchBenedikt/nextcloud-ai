name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    name: PHPUnit coverage (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Generate Clover coverage report
        run: php -d xdebug.mode=coverage vendor/bin/phpunit --bootstrap tests/bootstrap.php --coverage-clover coverage.xml tests/
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: coverage.xml
          if-no-files-found: error

  phpunit:
    name: PHPUnit (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          # Retry because GitHub API zipball downloads can transiently fail
          # with "curl error 60: SSL certificate problem" on fresh runners.
          for i in 1 2 3; do
            composer install --no-interaction --prefer-dist && break
            echo "composer install attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Run tests
        run: composer test

  groq-contract:
    name: Groq API contracts (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nextcloud/server
          ref: v32.0.0
          path: nextcloud-api
          sparse-checkout: lib/public
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Test Groq with real Nextcloud interfaces
        env:
          NEXTCLOUD_ROOT: ${{ github.workspace }}/nextcloud-api
        run: vendor/bin/phpunit --fail-on-skipped tests/GroqTest.php

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # The web search's page renderer is driven by these tests, so the browser
      # has to be present before them and not only before the Playwright suite.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test frontend behavior
        run: npm test

      - name: Build production bundles
        run: npm run build

      # The committed bundles are what the app actually serves, so a source
      # change that was never rebuilt would ship silently (issue #193). This
      # also catches stale output: webpack cleans js/ before emitting and keeps
      # only the hand-written assets, so a leftover file from a removed entry
      # point shows up here as a diff.
      - name: Verify the committed bundles match a fresh build
        run: |
          if ! git diff --quiet -- js/; then
            echo "::error::js/ differs from a fresh 'npm run build'. Run it and commit the result."
            git --no-pager diff --stat -- js/
            exit 1
          fi

      - name: Verify Markdown and the chat flow in a browser
        run: npm run test:browser

      - name: Verify expected bundles were emitted
        run: |
          for bundle in js/eva_ai-main.js js/eva_ai-main.js.map js/eva_ai_filesaction.js js/eva_ai_filesaction.js.map; do
            test -s "$bundle"
          done

  migration-regression:
    name: Migration and provider regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run migration/provider regression tests
        run: vendor/bin/phpunit --colors=always tests/MigrationRegressionTest.php tests/TaskProcessingContractTest.php tests/AppConfigUserSettingsTest.php

  nextcloud-app:
    name: Nextcloud app lifecycle (${{ matrix.nc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise the oldest supported release, the current stable line, and
        # the newest supported line on every pull request.
        nc: ['stable30', 'stable33', 'stable35']
    steps:
      - uses: actions/checkout@v4
      - name: Install and exercise the app in Nextcloud ${{ matrix.nc }}
        env:
          NC: ${{ matrix.nc }}
        run: |
          docker run --rm \
            -v "$PWD":/app:ro \
            -e NC="$NC" \
            ghcr.io/nextcloud/continuous-integration-php8.3 sh -euxc '
              if [ "$NC" = "latest" ]; then
                url="https://download.nextcloud.com/server/latest.tar.bz2"
              else
                url="https://download.nextcloud.com/server/$NC/latest.tar.bz2"
              fi
              curl -fsSL "$url" -o /tmp/nextcloud.tar.bz2
              mkdir -p /srv
              tar -xjf /tmp/nextcloud.tar.bz2 -C /srv
              cp -a /app /srv/nextcloud/apps/eva_ai
              cd /srv/nextcloud/apps/eva_ai
              composer install --no-interaction --prefer-dist
              cd /srv/nextcloud
              php occ maintenance:install --database sqlite3 --database-name nextcloud --admin-user admin --admin-pass admin --admin-email admin@example.test
              php occ app:enable eva_ai
              php occ app:check-code eva_ai
              php occ route:list | grep -F "eva_ai"
              cd /srv/nextcloud/apps/eva_ai
              composer test
            '

  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint all PHP files
        run: |
          find lib tests -name '*.php' -print0 | xargs -0 -n1 php -l
