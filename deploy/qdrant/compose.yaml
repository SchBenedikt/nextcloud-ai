services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: eva-qdrant
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    name: eva-qdrant-data
